<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LMG Apple Music Lyrics</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="bg-container"></div>
    <div id="fallback-bg"></div>

    <div id="app">
      <!-- Top header with track info, search & badge -->
      <header id="header">
        <div class="header-left">
          <img id="cover-img" src="" alt="Album Cover" class="cover-thumb hidden" />
          <div class="track-meta">
            <h1 id="track-title">Загрузка...</h1>
            <p id="track-artist"></p>
          </div>
        </div>
        <div class="header-right">
          <button id="btn-search" class="btn-icon" title="Поиск песни">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <span id="timing-badge" class="badge">Apple TTML</span>
        </div>
      </header>

      <!-- Center Lyric Container (AMLL Core mounts here) -->
      <main id="lyric-container">
        <div id="loading-spinner">
          <div class="spinner"></div>
          <p id="loading-text">Загрузка слоговой лирики...</p>
        </div>
      </main>

      <!-- Bottom Player Controls -->
      <footer id="footer">
        <div class="progress-bar-container" id="progress-container">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <div class="time-labels">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <div class="controls-row">
          <button id="btn-rewind" class="btn-ctrl" title="-10 сек">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 4v6h6"/>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
          </button>

          <button id="btn-play" class="btn-play-pause" title="Воспроизведение / Пауза">
            <svg id="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6 4 20 12 6 20 6 4"></polygon>
            </svg>
            <svg id="icon-pause" class="hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
            </svg>
          </button>

          <button id="btn-forward" class="btn-ctrl" title="+10 сек">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <!-- Search Modal Overlay -->
    <div id="search-overlay" class="search-overlay hidden">
      <div class="search-modal">
        <div class="search-header">
          <h3>Поиск песни</h3>
          <button id="btn-close-search" class="btn-close-modal">✕</button>
        </div>
        <form id="search-form" class="search-form">
          <input type="text" id="search-input" placeholder="Название или артист..." autocomplete="off" />
          <button type="submit" class="btn-search-submit">Найти</button>
        </form>
        <div class="chips-container">
          <span class="chips-title">Популярные треки:</span>
          <div class="chips-list">
            <button type="button" class="chip" data-title="CHIHIRO" data-artist="Billie Eilish">Billie Eilish — CHIHIRO</button>
            <button type="button" class="chip" data-title="Numb" data-artist="Linkin Park">Linkin Park — Numb</button>
            <button type="button" class="chip" data-title="Blinding Lights" data-artist="The Weeknd">The Weeknd — Blinding Lights</button>
            <button type="button" class="chip" data-title="In the End" data-artist="Linkin Park">Linkin Park — In The End</button>
          </div>
        </div>
      </div>
    </div>

    <audio id="audio-player" preload="auto" playsinline></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
